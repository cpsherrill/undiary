{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Undiary{% endblock %}</title>
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="{% static 'favicon.svg' %}">
  <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/">Undiary</a>
    {% if user.is_authenticated %}
    <div class="who">
      <button id="who-btn" class="who-btn" type="button" data-menu-button
              aria-haspopup="menu" aria-expanded="false" aria-label="Account">
        {% with sa=user.socialaccount_set.all|first %}
        {% if sa.extra_data.picture %}
        <img class="who-avatar" src="{{ sa.extra_data.picture }}" alt=""
             referrerpolicy="no-referrer">
        {% else %}
        <span class="who-fallback" aria-hidden="true">{{ user.email|default:user.username|first|upper }}</span>
        {% endif %}
        {% endwith %}
      </button>
      <div id="who-menu" class="popover who-menu" role="menu" data-menu hidden>
        <p class="who-email">{{ user.email|default:user.username }}</p>
        <form method="post" action="{% url 'account_logout' %}">
          {% csrf_token %}
          <button class="menu-item" type="submit" role="menuitem">Sign out</button>
        </form>
      </div>
    </div>
    {% endif %}
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
